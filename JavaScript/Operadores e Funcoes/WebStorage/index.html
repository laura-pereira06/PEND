<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Web Storage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Web Storage</h1>

        <input 
            type="text" 
            id="nome" 
            placeholder="Digite seu nome"
        >

        <div class="botoes">

            <button id="botaoSalvar">
                Salvar
            </button>

            <button id="botaoRecuperar">
                Recuperar
            </button>

            <button id="botaoRemover">
                Remover
            </button>

        </div>

        <p id="resultado"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
